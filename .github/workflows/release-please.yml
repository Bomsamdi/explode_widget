name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            # The PAT is what makes the chain work: a tag created with the
            # default GITHUB_TOKEN does not trigger other workflows, so
            # publish.yml would never fire. Without the secret this still keeps
            # the release PR up to date - only publishing stops being automatic.
            - uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
